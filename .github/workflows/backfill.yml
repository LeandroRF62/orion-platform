name: Backfill histórico (manual)

# Sem agendamento: só roda quando você clicar em "Run workflow".
on:
  workflow_dispatch:
    inputs:
      data_inicial:
        description: "Início (ex: 2026-01-01T00:00:00)"
        required: true
        default: "2026-01-01T00:00:00"
      data_final:
        description: "Fim (vazio = agora)"
        required: false
        default: ""

concurrency:
  group: ingestao-orion
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          DATA_INICIAL: ${{ inputs.data_inicial }}
          DATA_FINAL: ${{ inputs.data_final }}
        run: python -u ingestao/backfill.py
