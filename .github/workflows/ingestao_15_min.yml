name: Ingestão_Orion_(15min)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ingestao-orion
  cancel-in-progress: false

jobs:
  ingestao_incremental:
    runs-on: ubuntu-latest
    # A execução levava 18 a 22 min com agendamento de 15 min, então havia
    # sempre uma na fila. Corta em 14 min para a próxima começar limpa.
    timeout-minutes: 14

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar ingestão
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python ingestao/ingest_incremental.py
