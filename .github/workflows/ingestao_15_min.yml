name: Ingestão_Orion_(15min)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ingestao-orion
  cancel-in-progress: false

jobs:
  ingestao_incremental:
    runs-on: ubuntu-latest
    # Enquanto a base está atrasada, uma execução precisa de bastante tempo
    # para alcançar o presente. Depois que ficar em dia, cada execução passa a
    # durar poucos minutos. O bloco "concurrency" acima garante que não há
    # duas rodando ao mesmo tempo, mesmo que o cron dispare antes do fim.
    timeout-minutes: 50

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar ingestão
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        # -u desliga o buffer do stdout: sem isso o log do Actions fica vazio
        # até o script terminar, e não dá para acompanhar o andamento.
        run: python -u ingestao/ingest_incremental.py
